<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Log in — Foliq</title>
<link rel="stylesheet" href="/style.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .wrap{ min-height:100vh; display:grid; place-items:center; padding: 24px; }
  .panel{ width:100%; max-width: 420px; }
  .lock{ width:48px; height:48px; border-radius:14px; background:var(--gradient); display:grid; place-items:center; font-size:22px; margin: 0 auto 20px; }
  .panel h1{ text-align:center; font-size:26px; margin-bottom:6px; }
  .panel > p.muted{ text-align:center; margin-bottom:28px; }
  .status{ display:none; align-items:center; gap:10px; font-size:14px; padding:12px 14px; border-radius:12px; margin-top:14px; }
  .status.show{ display:flex; }
  .status.ok{ background: rgba(52,226,196,.1); color:#7ff3dc; border:1px solid rgba(52,226,196,.25); }
  .status.err{ background: rgba(255,90,90,.1); color:#ff9d9d; border:1px solid rgba(255,90,90,.25); }
  .backlink{ display:block; text-align:center; margin-top:22px; font-size:13px; color:var(--text-faint); }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel fade-up">
    <div class="lock">🔐</div>
    <h1>Welcome to Foliq</h1>
    <p class="muted">Sign in with just your email — no password needed.</p>

    <div class="card">
      <form id="login-form">
        <div class="field">
          <label for="email">Email address</label>
          <input class="input" id="email" type="email" placeholder="you@example.com" required autocomplete="email"/>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">
          <span id="btn-label">Send me a login link</span>
        </button>
      </form>
      <div class="status" id="status"></div>
    </div>
    <a class="backlink" href="/index.html">← Back to home</a>
  </div>
</div>

<script>
async function boot() {
  const cfg = await fetch('/api/config').then(r => r.json());
  const supabase = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  window._foliqClient = supabase;

  // If already logged in, skip straight to the dashboard.
  const { data: { session } } = await supabase.auth.getSession();
  if (session) { window.location.href = '/dashboard.html'; return; }

  const form = document.getElementById('login-form');
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('submit-btn');
  const btnLabel = document.getElementById('btn-label');

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = 'status show ' + (kind || '');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) return;
    btn.disabled = true;
    btnLabel.innerHTML = '<span class="spinner"></span>';
    const { error } = await supabase.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.origin + '/dashboard.html' }
    });
    btn.disabled = false;
    btnLabel.textContent = 'Send me a login link';
    if (error) {
      setStatus(error.message || 'Something went wrong. Try again.', 'err');
    } else {
      setStatus('Check your inbox — we sent a login link to ' + email + '.', 'ok');
      form.querySelector('button').textContent = 'Link sent ✓';
    }
  });

  // Handle the redirect back from the magic link (session appears in URL hash)
  supabase.auth.onAuthStateChange((event, session) => {
    if (session) window.location.href = '/dashboard.html';
  });
}
boot();
</script>
</body>
</html>
