<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Build your portfolio — Foliq</title>
<link rel="stylesheet" href="/style.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .wrap{ min-height:100vh; padding: 40px 24px 80px; }
  .form-panel{ max-width: 560px; margin: 0 auto; }
  .progress{ display:flex; gap:6px; margin-bottom:28px; }
  .progress i{ flex:1; height:4px; border-radius:4px; background: var(--border-strong); }
  .progress i.done{ background: var(--gradient); }
  .step{ display:none; }
  .step.active{ display:block; }
  .step-head{ margin-bottom: 24px; }
  .step-head h2{ font-size:24px; margin-bottom:6px; }
  .two-col{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  .nav-btns{ display:flex; justify-content:space-between; margin-top:8px; gap:12px; }
  .skip{ text-align:center; margin-top:10px; }
  .skip a{ font-size:13px; color:var(--text-faint); }

  .loading-screen{ display:none; text-align:center; padding: 90px 20px; max-width:480px; margin:0 auto; }
  .loading-screen.active{ display:block; }
  .loading-orb{ width:64px; height:64px; border-radius:50%; margin:0 auto 26px; background: var(--gradient); position:relative; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); opacity:1;} 50%{ transform:scale(1.12); opacity:.75; } }
  .loading-screen h2{ font-size:20px; margin-bottom:8px; }
  #loading-msg{ color:var(--text-dim); font-size:14.5px; min-height:20px; transition: opacity .25s ease; }
  .error-box{ display:none; margin-top:18px; }
</style>
</head>
<body>

<nav class="nav">
  <a class="brand" href="/index.html"><span class="brand-mark">F</span>Foliq</a>
  <a class="btn btn-ghost btn-sm" href="/dashboard.html">Cancel</a>
</nav>

<div class="wrap">
  <div class="form-panel" id="form-panel">
    <div class="progress"><i id="p1"></i><i id="p2"></i></div>

    <div class="step active" data-step="1">
      <div class="step-head">
        <h2>Let's start with the basics</h2>
        <p class="muted">Just two things we need from you.</p>
      </div>
      <div class="field">
        <label for="name">Full name *</label>
        <input class="input" id="name" placeholder="e.g. Jordan Lee" required/>
      </div>
      <div class="field">
        <label for="age">Age *</label>
        <input class="input" id="age" type="number" min="13" max="120" placeholder="e.g. 27" required/>
      </div>
      <div class="nav-btns">
        <span></span>
        <button class="btn btn-primary" id="to-step-2">Continue →</button>
      </div>
    </div>

    <div class="step" data-step="2">
      <div class="step-head">
        <h2>Help the AI get you right</h2>
        <p class="muted">All optional — but the more you add, the more accurate your portfolio.</p>
      </div>
      <div class="two-col">
        <div class="field">
          <label for="location">Where you live</label>
          <input class="input" id="location" placeholder="e.g. Seattle, WA"/>
        </div>
        <div class="field">
          <label for="role">Current role / title</label>
          <input class="input" id="role" placeholder="e.g. Product Designer"/>
        </div>
      </div>
      <div class="field">
        <label for="school">School / university</label>
        <input class="input" id="school" placeholder="e.g. University of Washington"/>
      </div>
      <div class="field">
        <label for="links">Links <span class="hint">(portfolio, GitHub, LinkedIn — comma separated)</span></label>
        <input class="input" id="links" placeholder="github.com/you, linkedin.com/in/you"/>
      </div>
      <div class="field">
        <label for="extra">Anything else? <span class="hint">Projects, awards, skills, interests — dump it all here</span></label>
        <textarea class="input" id="extra" rows="4" placeholder="e.g. Built a budgeting app used by 2,000 people, love rock climbing, fluent in Spanish…"></textarea>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" id="to-step-1">← Back</button>
        <button class="btn btn-primary" id="generate-btn">Generate my portfolio ✨</button>
      </div>
    </div>
  </div>

  <div class="loading-screen" id="loading-screen">
    <div class="loading-orb"></div>
    <h2>Building your portfolio</h2>
    <div id="loading-msg">Getting started…</div>
    <div class="error-box card" id="error-box">
      <p style="margin-bottom:14px" id="error-text">Something went wrong.</p>
      <button class="btn btn-primary btn-sm" id="retry-btn">Try again</button>
    </div>
  </div>
</div>

<script>
let supabaseClient, user;
const state = {};

async function boot() {
  const cfg = await fetch('/api/config').then(r => r.json());
  // window.supabase is provided by the CDN build; avoid shadowing that global name.
  supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = '/login.html'; return; }
  user = session.user;
}
boot();

function showStep(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.toggle('active', s.dataset.step == n));
  document.getElementById('p1').classList.toggle('done', n >= 1);
  document.getElementById('p2').classList.toggle('done', n >= 2);
}

document.getElementById('to-step-2').addEventListener('click', () => {
  const name = document.getElementById('name').value.trim();
  const age = document.getElementById('age').value;
  if (!name || !age) { alert('Name and age are required.'); return; }
  showStep(2);
});
document.getElementById('to-step-1').addEventListener('click', () => showStep(1));

const LOADING_MESSAGES = [
  'Reading what you told us…',
  'Looking up publicly available info…',
  'Writing your bio…',
  'Designing your layout…',
  'Adding the finishing touches…'
];

function cycleMessages() {
  let i = 0;
  const el = document.getElementById('loading-msg');
  el.textContent = LOADING_MESSAGES[0];
  return setInterval(() => {
    i = (i + 1) % LOADING_MESSAGES.length;
    el.style.opacity = 0;
    setTimeout(() => { el.textContent = LOADING_MESSAGES[i]; el.style.opacity = 1; }, 250);
  }, 2200);
}

async function generate() {
  document.getElementById('form-panel').style.display = 'none';
  document.getElementById('loading-screen').classList.add('active');
  document.getElementById('error-box').style.display = 'none';
  const timer = cycleMessages();

  const profile = {
    name: document.getElementById('name').value.trim(),
    age: Number(document.getElementById('age').value),
    location: document.getElementById('location').value.trim(),
    role: document.getElementById('role').value.trim(),
    school: document.getElementById('school').value.trim(),
    links: document.getElementById('links').value.trim(),
    extra: document.getElementById('extra').value.trim()
  };

  try {
    const enrichRes = await fetch('/api/enrich', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ profile })
    });
    const enrichData = enrichRes.ok ? await enrichRes.json() : { results: [] };

    const genRes = await fetch('/api/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ profile, searchResults: enrichData.results || [] })
    });
    if (!genRes.ok) throw new Error((await genRes.json()).error || 'Generation failed');
    const portfolioData = await genRes.json();

    const { data: row, error } = await supabaseClient.from('portfolios').insert({
      user_id: user.id,
      name: profile.name,
      age: profile.age,
      location: profile.location || null,
      data: portfolioData,
      published: false
    }).select().single();

    if (error) throw error;

    clearInterval(timer);
    window.location.href = '/preview.html?id=' + row.id;
  } catch (err) {
    clearInterval(timer);
    document.getElementById('error-text').textContent = err.message || 'Something went wrong. Please try again.';
    document.getElementById('error-box').style.display = 'block';
  }
}

document.getElementById('generate-btn').addEventListener('click', generate);
document.getElementById('retry-btn').addEventListener('click', generate);
</script>
</body>
</html>
