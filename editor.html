<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Editor — Foliq</title>
<link rel="stylesheet" href="/style.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/render.js"></script>
<style>
  html,body{ height:100%; overflow:hidden; }
  .app{ display:grid; grid-template-rows: auto 1fr; height:100vh; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding: 12px 20px; border-bottom:1px solid var(--border); gap:14px; flex-wrap:wrap; }
  .topbar .left, .topbar .right{ display:flex; align-items:center; gap:10px; }
  .tabs{ display:flex; background: var(--surface-2); border:1px solid var(--border-strong); border-radius:100px; padding:3px; }
  .tabs button{ border:none; background:transparent; color:var(--text-dim); padding:7px 18px; border-radius:100px; font-weight:600; font-size:13.5px; cursor:pointer; }
  .tabs button.active{ background: var(--gradient); color:#fff; }
  .save-state{ font-size:12px; color:var(--text-faint); min-width:80px; }

  .body-grid{ display:grid; grid-template-columns: 270px 1fr 300px; min-height:0; }
  .side{ border-right:1px solid var(--border); overflow-y:auto; padding: 18px; }
  .side.right{ border-right:none; border-left:1px solid var(--border); }
  .side h4{ font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); margin: 18px 0 10px; }
  .side h4:first-child{ margin-top:0; }

  .theme-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; }
  .theme-swatch{ height:40px; border-radius:9px; cursor:pointer; border:2px solid transparent; position:relative; }
  .theme-swatch.active{ border-color:#fff; }
  .theme-swatch span{ position:absolute; bottom:3px; left:6px; font-size:9px; font-weight:700; color:rgba(255,255,255,.85); text-shadow: 0 1px 2px rgba(0,0,0,.5); }

  .sect-list{ display:flex; flex-direction:column; gap:6px; }
  .sect-row{ display:flex; align-items:center; gap:8px; padding: 9px 10px; border-radius:10px; background: var(--surface-2); border:1px solid var(--border); cursor:grab; font-size:13.5px; }
  .sect-row.dragging{ opacity:.4; }
  .sect-row .handle{ color:var(--text-faint); font-size:12px; }
  .sect-row .name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sect-row button{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:14px; padding:2px; }
  .sect-row button:hover{ color:#ff8a8a; }
  .add-sect{ position:relative; margin-top:10px; }
  .add-menu{ display:none; position:absolute; top:110%; left:0; right:0; background: var(--surface-2); border:1px solid var(--border-strong); border-radius:12px; padding:6px; z-index:20; box-shado[...]
  .add-menu.show{ display:block; }
  .add-menu button{ display:block; width:100%; text-align:left; background:none; border:none; color:var(--text); padding:9px 10px; border-radius:8px; font-size:13.5px; cursor:pointer; }
  .add-menu button:hover{ background: rgba(255,255,255,.06); }

  /* Make canvas iframe fill the available space instead of a small centered preview */
  .canvas-wrap{ background: #060608; display:flex; align-items:stretch; padding:0; overflow:hidden; min-height:0; }
  .canvas-wrap iframe{ width:100%; height:100%; border:none; border-radius:0; background:#0b0c10; flex:1; min-height:0; }

  .inspector-empty{ color:var(--text-faint); font-size:13.5px; line-height:1.6; }
  .insp-label{ font-size:13px; font-weight:700; margin-bottom:14px; padding: 8px 12px; background: var(--gradient-soft); border-radius:9px; color:#e7defe; }
  .trigger-opts{ display:flex; gap:6px; margin-bottom:14px; }
  .trigger-opts button{ flex:1; padding:9px 4px; border-radius:9px; border:1px solid var(--border-strong); background: var(--surface-2); color:var(--text-dim); font-size:12px; font-weight:600; cursor:[...]
  .trigger-opts button.active{ background: var(--gradient); color:#fff; border-color:transparent; }
  .delay-row{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .delay-row input[type=range]{ flex:1; }
  .insp-actions{ display:flex; flex-direction:column; gap:8px; margin-top:16px; }

  .toast{ position:fixed; bottom:22px; left:50%; transform: translateX(-50%) translateY(20px); background: var(--surface); border:1px solid var(--border-strong); padding: 12px 20px; border-radius:12px[...]
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  .published-modal{ position:fixed; inset:0; background:rgba(6,6,10,.7); backdrop-filter: blur(6px); display:none; place-items:center; z-index:300; padding:20px; }
  .published-modal.show{ display:grid; }
  .modal-card{ max-width:440px; width:100%; text-align:center; padding: 36px 28px; }
  .link-box{ display:flex; gap:8px; margin: 18px 0 6px; }
  .link-box input{ flex:1; }

  @media (max-width: 960px){
    .body-grid{ grid-template-columns: 1fr; }
    .side{ display:none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="left">
      <a class="brand" href="/dashboard.html" style="font-size:16px"><span class="brand-mark" style="width:24px;height:24px;font-size:12px">F</span>Foliq</a>
      <span class="pill" id="name-pill">Loading…</span>
    </div>
    <div class="tabs">
      <button id="tab-edit" class="active">✏️ Edit</button>
      <button id="tab-preview">👁 Preview</button>
    </div>
    <div class="right">
      <span class="save-state" id="save-state"></span>
      <button class="btn btn-ghost btn-sm" id="save-btn">Save</button>
      <button class="btn btn-primary btn-sm" id="publish-btn">Publish</button>
    </div>
  </div>

  <div class="body-grid">
    <div class="side left">
      <h4>Theme</h4>
      <div class="theme-grid" id="theme-grid"></div>

      <h4>Sections</h4>
      <div class="sect-list" id="sect-list"></div>
      <div class="add-sect">
        <button class="btn btn-ghost btn-sm btn-block" id="add-sect-btn">+ Add section</button>
        <div class="add-menu" id="add-menu"></div>
      </div>
    </div>

    <div class="canvas-wrap">
      <iframe id="canvas-frame"></iframe>
    </div>

    <div class="side right" id="inspector">
      <h4>Inspector</h4>
      <p class="inspector-empty" id="insp-empty">Click any element in the canvas to edit its text, or set a fade-in / fade-out trigger.</p>
      <div id="insp-content" style="display:none"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="published-modal" id="published-modal">
  <div class="card modal-card">
    <div style="width:52px;height:52px;border-radius:50%;background:var(--gradient);display:grid;place-items:center;margin:0 auto 16px;font-size:24px">✓</div>
    <h2 style="margin-bottom:6px">Published!</h2>
    <p class="muted">Your portfolio is live and ready to share.</p>
    <div class="link-box">
      <input class="input" id="live-link" readonly/>
      <button class="btn btn-ghost btn-sm" id="copy-link">Copy</button>
    </div>
    <a class="btn btn-primary btn-block" id="view-live" target="_blank" style="margin-top:14px">View live site →</a>
    <button class="btn btn-ghost btn-block" id="close-modal" style="margin-top:10px">Keep editing</button>
  </div>
</div>

<script>
let supabaseClient, user, portfolio, data;
let mode = 'edit';
let selectedKey = null;
let dragIndex = null;
const params = new URLSearchParams(location.search);
const id = params.get('id');

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------------- boot ---------------- */
async function boot() {
  const cfg = await fetch('/api/config').then(r => r.json());
  supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { location.href = '/login.html'; return; }
  user = session.user;
  if (!id) { location.href = '/dashboard.html'; return; }

  const { data: row, error } = await supabaseClient.from('portfolios').select('*').eq('id', id).single();
  if (error || !row) { location.href = '/dashboard.html'; return; }
  portfolio = row;
  data = row.data;

  document.getElementById('name-pill').textContent = row.published ? '● Published' : '● Draft';
  buildThemeGrid();
  buildSectionList();
  renderCanvas();
}

/* ---------------- theme grid ---------------- */
function buildThemeGrid() {
  const grid = document.getElementById('theme-grid');
  grid.innerHTML = '';
  Object.keys(Foliq.THEMES).forEach(key => {
    const t = Foliq.THEMES[key];
    const div = document.createElement('div');
    div.className = 'theme-swatch' + (data.theme === key ? ' active' : '');
    div.style.background = t.gradient;
    div.innerHTML = `<span>${t.label}</span>`;
    div.addEventListener('click', () => {
      data.theme = key;
      buildThemeGrid();
      renderCanvas();
      markUnsaved();
    });
    grid.appendChild(div);
  });
}

/* ---------------- section list (sidebar) ---------------- */
function buildSectionList() {
  const list = document.getElementById('sect-list');
  list.innerHTML = '';
  (data.sections || []).forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'sect-row';
    row.draggable = true;
    row.dataset.index = i;
    row.innerHTML = `<span class="handle">⠿</span><span class="name"></span><button title="Delete">✕</button>`;
    row.querySelector('.name').textContent = s.title;

    row.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      selectKey('section:' + s.id);
    });
    row.querySelector('button').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!confirm('Delete the "' + s.title + '" section?')) return;
      data.sections.splice(i, 1);
      buildSectionList(); renderCanvas(); markUnsaved();
    });
    row.addEventListener('dragstart', () => { dragIndex = i; row.classList.add('dragging'); });
    row.addEventListener('dragend', () => row.classList.remove('dragging'));
    row.addEventListener('dragover', (e) => e.preventDefault());
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      if (dragIndex === null || dragIndex === i) return;
      const moved = data.sections.splice(dragIndex, 1)[0];
      data.sections.splice(i, 0, moved);
      dragIndex = null;
      buildSectionList(); renderCanvas(); markUnsaved();
    });
    list.appendChild(row);
  });
}

const SECTION_TYPES = ['experience', 'education', 'projects', 'skills', 'contact', 'custom'];
function buildAddMenu() {
  const menu = document.getElementById('add-menu');
  menu.innerHTML = '';
  SECTION_TYPES.forEach(type => {
    const btn = document.createElement('button');
    btn.textContent = '+ ' + (Foliq.SECTION_LABELS[type] || type);
    btn.addEventListener('click', () => {
      const sec = Foliq.createEmptySection(type);
      data.sections = data.sections || [];
      data.sections.push(sec);
      menu.classList.remove('show');
      buildSectionList(); renderCanvas(); markUnsaved();
      selectKey('section:' + sec.id);
    });
    menu.appendChild(btn);
  });
}
buildAddMenu();
document.getElementById('add-sect-btn').addEventListener('click', () => {
  document.getElementById('add-menu').classList.toggle('show');
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.add-sect')) document.getElementById('add-menu').classList.remove('show');
});

/* ---------------- canvas ---------------- */
function renderCanvas() {
  const iframe = document.getElementById('canvas-frame');
  const editable = mode === 'edit';
  iframe.srcdoc = Foliq.fullDocument(data, { editable, bridge: editable });
  if (editable && selectedKey) {
    iframe.addEventListener('load', function onLoad() {
      iframe.contentWindow.postMessage({ type: 'foliq:highlight', key: selectedKey }, '*');
      iframe.removeEventListener('load', onLoad);
    });
  }
}

window.addEventListener('message', (ev) => {
  const msg = ev.data || {};
  if (msg.type === 'foliq:select') { selectKey(msg.key); }
  if (msg.type === 'foliq:field') { Foliq.setByPath(data, msg.path, msg.value); markUnsaved(); }
});

/* ---------------- tabs ---------------- */
document.getElementById('tab-edit').addEventListener('click', () => setMode('edit'));
document.getElementById('tab-preview').addEventListener('click', () => setMode('preview'));
function setMode(m) {
  mode = m;
  document.getElementById('tab-edit').classList.toggle('active', m === 'edit');
  document.getElementById('tab-preview').classList.toggle('active', m === 'preview');
  renderCanvas();
}

/* ---------------- inspector / selection ---------------- */
function humanLabel(key) {
  if (!key) return '';
  if (key === 'hero') return 'Hero header';
  if (key === 'about') return 'About section';
  const sm = /^section:([^:]+)$/.exec(key);
  if (sm) { const s = Foliq.findSection(data, sm[1]); return 'Section — ' + (s ? s.title : ''); }
  const im = /^section:([^:]+):item:(\d+)$/.exec(key);
  if (im) { const s = Foliq.findSection(data, im[1]); return 'Item in ' + (s ? s.title : ''); }
  return key;
}

function selectKey(key) {
  selectedKey = key;
  const iframe = document.getElementById('canvas-frame');
  if (iframe.contentWindow) iframe.contentWindow.postMessage({ type: 'foliq:highlight', key }, '*');
  renderInspector();
}

function renderInspector() {
  const empty = document.getElementById('insp-empty');
  const content = document.getElementById('insp-content');
  if (!selectedKey) { empty.style.display = 'block'; content.style.display = 'none'; return; }
  empty.style.display = 'none'; content.style.display = 'block';

  const target = Foliq.getAnimTarget(data, selectedKey);
  const anim = (target && target.animation) || { type: 'none', delay: 0 };
  const isItem = /:item:\d+$/.test(selectedKey);
  const isSection = /^section:[^:]+$/.test(selectedKey);
  const itemMatch = /^section:([^:]+):item:(\d+)$/.exec(selectedKey);

  let linkFieldHtml = '';
  if (itemMatch) {
    const sec = Foliq.findSection(data, itemMatch[1]);
    const item = sec && sec.items[+itemMatch[2]];
    if (sec && sec.type === 'contact' && item) {
      linkFieldHtml = `<div class="field"><label>Link URL</label><input class="input" id="insp-link" value="${(item.link || '').replace(/"/g,'&quot;')}"/></div>`;
    }
  }

  content.innerHTML = `
    <div class="insp-label">${humanLabel(selectedKey)}</div>
    <div class="field"><label>Entrance trigger</label>
      <div class="trigger-opts" id="trig-opts">
        <button data-t="none" class="${anim.type === 'none' || !anim.type ? 'active' : ''}">None</button>
        <button data-t="fade-in" class="${anim.type === 'fade-in' ? 'active' : ''}">Fade in</button>
        <button data-t="fade-out" class="${anim.type === 'fade-out' ? 'active' : ''}">Fade out</button>
      </div>
    </div>
    <div class="delay-row" id="delay-row" style="display:${anim.type && anim.type !== 'none' ? 'flex' : 'none'}">
      <input type="range" id="delay-range" min="0" max="4000" step="100" value="${anim.delay || 0}"/>
      <span class="pill" id="delay-label" style="min-width:56px;text-align:center">${((anim.delay || 0) / 1000).toFixed(1)}s</span>
    </div>
    ${linkFieldHtml}
    <div class="insp-actions">
      ${isSection ? `<button class="btn btn-ghost btn-sm btn-block" id="add-item-btn">+ Add item to this section</button>` : ''}
      ${isItem ? `<button class="btn btn-ghost btn-sm btn-block" id="dup-item-btn">Duplicate item</button>
                  <button class="btn btn-danger btn-sm btn-block" id="del-item-btn">Delete item</button>` : ''}
    </div>
  `;

  content.querySelectorAll('#trig-opts button').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = btn.dataset.t;
      const delayInput = document.getElementById('delay-range');
      const delay = delayInput ? Number(delayInput.value) : 0;
      Foliq.setAnim(data, selectedKey, t === 'none' ? null : { type: t, delay });
      renderCanvas(); renderInspector(); markUnsaved();
    });
  });
  const delayRange = document.getElementById('delay-range');
  if (delayRange) {
    delayRange.addEventListener('input', () => {
      document.getElementById('delay-label').textContent = (delayRange.value / 1000).toFixed(1) + 's';
    });
    delayRange.addEventListener('change', () => {
      const t = target.animation ? target.animation.type : 'fade-in';
      Foliq.setAnim(data, selectedKey, { type: t, delay: Number(delayRange.value) });
      renderCanvas(); markUnsaved();
    });
  }
  const linkInput = document.getElementById('insp-link');
  if (linkInput) {
    linkInput.addEventListener('change', () => {
      const sec = Foliq.findSection(data, itemMatch[1]);
      sec.items[+itemMatch[2]].link = linkInput.value;
      renderCanvas(); markUnsaved();
    });
  }
  const addItemBtn = document.getElementById('add-item-btn');
  if (addItemBtn) addItemBtn.addEventListener('click', () => {
    const sm = /^section:([^:]+)$/.exec(selectedKey);
    const sec = Foliq.findSection(data, sm[1]);
    const tmp = Foliq.createEmptySection(sec.type);
    sec.items.push(tmp.items[0]);
    renderCanvas(); markUnsaved();
    selectKey('section:' + sec.id + ':item:' + (sec.items.length - 1));
  });
  const dupBtn = document.getElementById('dup-item-btn');
  if (dupBtn) dupBtn.addEventListener('click', () => {
    const sec = Foliq.findSection(data, itemMatch[1]);
    const idx = +itemMatch[2];
    sec.items.splice(idx + 1, 0, JSON.parse(JSON.stringify(sec.items[idx])));
    renderCanvas(); markUnsaved();
    selectKey('section:' + sec.id + ':item:' + (idx + 1));
  });
  const delBtn = document.getElementById('del-item-btn');
  if (delBtn) delBtn.addEventListener('click', () => {
    const sec = Foliq.findSection(data, itemMatch[1]);
    const idx = +itemMatch[2];
    sec.items.splice(idx, 1);
    selectedKey = 'section:' + sec.id;
    renderCanvas(); renderInspector(); markUnsaved();
  });
}

/* ---------------- save / publish ---------------- */
let unsaved = false;
function markUnsaved() { unsaved = true; document.getElementById('save-state').textContent = 'Unsaved changes'; }

async function save() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  const { error } = await supabaseClient.from('portfolios').update({ data, name: (data.hero && data.hero.name) || portfolio.name }).eq('id', id);
  btn.disabled = false;
  if (error) { toast('Save failed: ' + error.message); return; }
  unsaved = false;
  document.getElementById('save-state').textContent = 'Saved ✓';
  toast('Saved');
}
document.getElementById('save-btn').addEventListener('click', save);

async function publish() {
  const btn = document.getElementById('publish-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  await save();

  let slug = portfolio.slug;
  if (!slug) {
    const base = Foliq.slugify(data.hero.name || portfolio.name);
    slug = base; let attempt = 0;
    while (true) {
      const { data: existing } = await supabaseClient.from('portfolios').select('id').eq('slug', slug).neq('id', id).maybeSingle();
      if (!existing) break;
      attempt++; slug = base + '-' + Math.random().toString(36).slice(2, 5);
      if (attempt > 5) break;
    }
  }
  const { data: row, error } = await supabaseClient.from('portfolios').update({ published: true, slug }).eq('id', id).select().single();
  btn.disabled = false; btn.textContent = 'Publish';
  if (error) { toast('Publish failed: ' + error.message); return; }
  portfolio = row;
  document.getElementById('name-pill').textContent = '● Published';

  const url = location.origin + '/portfolio?name=' + encodeURIComponent(row.slug);
  document.getElementById('live-link').value = url;
  document.getElementById('view-live').href = url;
  document.getElementById('published-modal').classList.add('show');
}
document.getElementById('publish-btn').addEventListener('click', publish);
document.getElementById('close-modal').addEventListener('click', () => document.getElementById('published-modal').classList.remove('show'));
document.getElementById('copy-link').addEventListener('click', () => {
  const input = document.getElementById('live-link');
  input.select(); document.execCommand('copy');
  const btn = document.getElementById('copy-link');
  btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500);
});

window.addEventListener('beforeunload', (e) => { if (unsaved) { e.preventDefault(); e.returnValue = ''; } });

boot();
</script>
</body>
</html>
